name: Native macOS proof for reviewed existing PRs
on:
  push:
    branches: [validation/peekaboo-native-review-20261012]
    paths: [.github/workflows/validate-review-native.yml, .github/validation/review20261012/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peekaboo-native-review-20261012
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - number: 1020
            head: 6cc99c2a8123848fb6a1a48597ef66b16de233ab
          - number: 1027
            head: f0a97b20e2a9f91cb4630f75c4ce412ab2aecd9a
    runs-on: macos-26
    timeout-minutes: 150
    env:
      PEEKABOO_BUILD_JOBS: '2'
      PEEKABOO_INCLUDE_AUTOMATION_TESTS: 'false'
      PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: 'false'
      RUN_AUTOMATION_TESTS: 'false'
      RUN_LOCAL_TESTS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rudycelekli/Peekaboo
          ref: ${{ matrix.head }}
          path: source
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.9.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: source/package.json
      - name: Select official compatible Xcode and install style tools
        shell: bash
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          command -v rg >/dev/null || brew install ripgrep
          command -v uv >/dev/null || brew install uv
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v swiftformat >/dev/null || brew install swiftformat
          xcodebuild -version
          swift --version
          swiftlint version
          swiftformat --version
          uv --version
      - name: Canonical required gates and actual native consumer traces
        working-directory: source
        shell: bash
        env:
          PR_NUMBER: ${{ matrix.number }}
          SOURCE_HEAD: ${{ matrix.head }}
          PROOF_ASSETS: ${{ github.workspace }}/validation/.github/validation/review20261012
          PROOF_OUTPUT: ${{ runner.temp }}/proof
        run: |
          set -euo pipefail
          python3 "$PROOF_ASSETS/native-proof.py"
      - name: Preserve logs and exact source/runtime receipts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: peekaboo-native-${{ matrix.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          retention-days: 14
          if-no-files-found: warn

  unified-log:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rudycelekli/Peekaboo
          ref: ca7bb5d2832f3cb33453c7c3d9ad01614eca896d
          path: source
          persist-credentials: false
      - name: Real unified-log error visibility and info exclusion
        working-directory: source
        env:
          SOURCE_HEAD: ca7bb5d2832f3cb33453c7c3d9ad01614eca896d
          PROOF_OUTPUT: ${{ runner.temp }}/oslog-proof
        run: python3 "$GITHUB_WORKSPACE/validation/.github/validation/review20261012/oslog-proof.py"
      - name: Preserve actual OS-log trace and receipts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: peekaboo-oslog-1033-${{ github.run_id }}
          path: ${{ runner.temp }}/oslog-proof
          retention-days: 14
          if-no-files-found: warn
