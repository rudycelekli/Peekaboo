name: Canonical CLI proof for two frozen review repairs
on:
  push:
    branches: [validation/peekaboo-native-review-20261012]
    paths: [.github/workflows/validate-cli-review.yml, .github/validation/cli-review20261012/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peekaboo-cli-review-20261012
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - number: 1043
            head: e7c99895e8a692b5e8147a5d2abf956ac9b18188
            baseline: fa8556d81c341fbba8721b5c83d04312a2976458
            filter: AgentOutputDelegateBoundaryRegressionTests
            count: 14
          - number: 1038
            head: f1f26bef5195393b5f7bfb7a733eb130a11a66d5
            baseline: 1b6888a4c43c97e728f67833cf6c334ea51a67b2
            filter: BuildStalenessProcessWaitTests
            count: 4
    runs-on: macos-26
    timeout-minutes: 65
    env:
      PEEKABOO_BUILD_JOBS: '2'
      PEEKABOO_INCLUDE_AUTOMATION_TESTS: 'false'
      PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: 'false'
      RUN_AUTOMATION_TESTS: 'false'
      RUN_LOCAL_TESTS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rudycelekli/Peekaboo
          ref: ${{ matrix.head }}
          path: source
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.9.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: source/package.json
      - name: Select official compatible Xcode and install style tools
        shell: bash
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          command -v rg >/dev/null || brew install ripgrep
          command -v uv >/dev/null || brew install uv
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v swiftformat >/dev/null || brew install swiftformat
          xcodebuild -version
          swift --version
          swiftlint version
          swiftformat --version
          uv --version
      - name: Canonical required gates and actual native consumer traces
        working-directory: source
        shell: bash
        env:
          PR_NUMBER: ${{ matrix.number }}
          BASELINE_HEAD: ${{ matrix.baseline }}
          TEST_FILTER: ${{ matrix.filter }}
          TEST_COUNT: ${{ matrix.count }}
          SOURCE_HEAD: ${{ matrix.head }}
          PROOF_ASSETS: ${{ github.workspace }}/validation/.github/validation/cli-review20261012
          PROOF_OUTPUT: ${{ runner.temp }}/proof
        run: |
          set -euo pipefail
          python3 "$PROOF_ASSETS/cli-proof.py"
      - name: Preserve logs and exact source/runtime receipts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: peekaboo-cli-${{ matrix.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          retention-days: 14
          if-no-files-found: warn
